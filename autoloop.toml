# AutoLoop configuration. Generated by `autoloop init`, then hand-edited to match
# docs section 11.4. Protected path: change it by hand, never through AutoLoop.

repo = "Sanctum-Origo-Systems/ai-systems-lab"

triage_model = "sonnet"
impl_model = "claude-opus-5-5"

impl_timeout = 900       # same as Patina. Size the tasks (11.7) before raising this.
triage_timeout = 90
test_timeout = 300       # init writes 120; verify.sh does more than pytest, and the mutation gate runs it twice

pr_reviewer = "andywidjaja"

verify_cmd = "./scripts/verify.sh"
# Set by hand (init writes ""). fnmatch's * also matches "/", so this one glob covers
# lib/tests/, every 0N-name/tests/, and anything nested under them.
test_pattern = "*/tests/*"

# Flags (doesn't block) PRs whose test diffs add skip/xfail, delete tests or remove asserts:
# the issue gets needs-human and Hedy looks before Andy does.
test_integrity_guard = true
test_integrity_patterns = ["pytest.mark.skip", "pytest.mark.xfail", "pytest.skip(", "importorskip"]

max_story_points = 3
max_retries = 3

protected_paths = [
  "autoloop.toml",
  ".github/",
  ".claude/",
  "scripts/verify.sh",
  "deploy/terraform/base/",
]

auto_merge = false
# AutoLoop's per-module metrics only recognize src/<app>/ at the repo root. Here every PR
# would land in one "other" bucket, so use repo-level metrics, as Patina does.
auto_merge_promotion_level = "repo"

triage_labels = [
  "ready",
  "rejected",
  "needs-decomposition",
  "in-progress",
  "in-review",
  "needs-human",
  "review-queue",
  "external",
]

[implement]
isolation = "worktree"   # each run gets its own worktree under ~/.autoloop/<hash>/worktrees/

[jev]
mode = "off"             # no OpenRouter key on the home PC

[eval]
fixup_ignore = ["uv.lock", "**/RESULTS.md"]
