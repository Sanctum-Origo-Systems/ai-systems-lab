# Base datastores shared by every workstream. No profile: always on.
# Datastores publish nothing; other services reach them over the `ai-systems-lab` network.
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ai-systems-lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    cpus: 2
    mem_limit: 2g
    restart: unless-stopped

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1@sha256:e4580ab9ad1bd5cd37b4ba04911bc5ccc8cd2d9ab4de56ece65acee71c24e05c
    networks:
      - ai-systems-lab
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9324/?Action=ListQueues"]
      interval: 5s
      timeout: 3s
      retries: 10
    cpus: 0.5
    mem_limit: 256m
    restart: unless-stopped

networks:
  ai-systems-lab:
    name: ai-systems-lab

volumes:
  pgdata:
