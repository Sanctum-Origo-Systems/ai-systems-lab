[project]
name = "labkit"
version = "0.1.0"
description = "Shared library for ai-systems-lab: settings, logging, queue, object store, metrics."
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.16.3",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
