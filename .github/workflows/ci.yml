name: CI

# Spec section 7 and 11.2: CI runs the same gate as AutoLoop and Hedy (scripts/verify.sh),
# then the checks that need the network: terraform validate and gitleaks.
# A check whose inputs don't exist yet is skipped with a visible ::notice::, never silently.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.17.2"
  GITLEAKS_VERSION: "8.30.1"
  CHECKOV_VERSION: "3.4.11"

jobs:
  verify:
    name: verify.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version-file: .python-version
      # verify.sh runs `terraform fmt` once deploy/terraform exists, so install it up front.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      # verify.sh runs the offline IaC security scan when checkov is on PATH.
      - name: Install checkov (pinned)
        run: uv tool install "checkov==${CHECKOV_VERSION}"
      - name: Run scripts/verify.sh
        run: ./scripts/verify.sh

  terraform-validate:
    name: terraform validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Validate every root module (no backend, no credentials)
        run: |
          shopt -s nullglob
          roots=()
          for dir in deploy/terraform/*/; do
            [ "$dir" = "deploy/terraform/modules/" ] && continue
            compgen -G "${dir}*.tf" > /dev/null && roots+=("$dir")
          done
          if [ ${#roots[@]} -eq 0 ]; then
            echo "::notice title=terraform validate skipped::No Terraform root modules under deploy/terraform yet (added by 00 Task 5)."
            exit 0
          fi
          for dir in "${roots[@]}"; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            if compgen -G "${dir}tests/*.tftest.hcl" > /dev/null; then
              terraform -chdir="$dir" test
            fi
            echo "::endgroup::"
          done
      - name: Validate and test every shared module (mock provider, no credentials)
        run: |
          shopt -s nullglob
          mods=(deploy/terraform/modules/*/)
          if [ ${#mods[@]} -eq 0 ]; then
            echo "::notice title=module checks skipped::No modules under deploy/terraform/modules yet."
            exit 0
          fi
          for dir in "${mods[@]}"; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            if compgen -G "${dir}tests/*.tftest.hcl" > /dev/null; then
              terraform -chdir="$dir" test
            else
              echo "::notice title=no terraform tests::$dir has no tests/*.tftest.hcl"
            fi
            echo "::endgroup::"
          done

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The binary, not gitleaks-action: the action needs a paid license on organization repos.
      - name: Install gitleaks (checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c checksums.txt
          tar xzf "$tarball" gitleaks
      - name: Scan full git history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
